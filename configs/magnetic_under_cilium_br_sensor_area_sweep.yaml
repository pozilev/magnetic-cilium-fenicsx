# FEM sweep for effective remanence and finite Hall active area.
#
# This is a diagnostic sweep, not a fit of Br. The expected check is
# |dB| / Br ~= const for fixed sensor averaging radius.

global:
  mode: magnetics-fem
  master_mode: under_cilium_br_sensor_area_sweep
  results_write_mode: experiment
  experiment_id: under_cilium_br_sensor_area_v1
  master_csv_path: results/magnetic_results_master.csv
  restart_dir: ../magnetic_cilium_3d_results_final/final_P2_hcil_20um_hsub_100um_delta_0p550mm
  output_dir: ../magnetic_fem_under_cilium_br_sensor_area_results
  validation_summary_csv: magnetic_under_cilium_br_sensor_area_summary.csv
  magnetic_boundary: natural
  sensor_average: true
  sensor_average_n: 13
  target_sensitivity_uT_per_uN: 0.63
  h_air: 75.0e-6
  h_air_near: 75.0e-6
  h_air_far: 225.0e-6
  near_radius_factor: 3.0
  near_source_padding_factor: 2.0
  near_sensor_padding_factor: 1.0
  air_radius_factor: 12.0
  # R = 60 um, so 20R = 1.2 mm keeps the z_s = -1 mm Hall plane inside the air box.
  air_below_factor: 20.0
  air_above_factor: 4.0
  projection_mode: cell_center
  max_air_cells: 700000

fixed_physical_parameters:
  sensor_x: 0.0
  sensor_y: 0.0
  sensor_z: -1.0e-3
  rotate_magnetization: true

sweep:
  Br_0p10T:
    fixed:
      Br: 0.10
    cases:
      - id: rs_25um
        sensor_average_radius: 25.0e-6
      - id: rs_50um
        sensor_average_radius: 50.0e-6
      - id: rs_75um
        sensor_average_radius: 75.0e-6
      - id: rs_100um
        sensor_average_radius: 100.0e-6
      - id: rs_500um
        sensor_average_radius: 500.0e-6

  Br_0p15T:
    fixed:
      Br: 0.15
    cases:
      - id: rs_25um
        sensor_average_radius: 25.0e-6
      - id: rs_50um
        sensor_average_radius: 50.0e-6
      - id: rs_75um
        sensor_average_radius: 75.0e-6
      - id: rs_100um
        sensor_average_radius: 100.0e-6
      - id: rs_500um
        sensor_average_radius: 500.0e-6

  Br_0p20T:
    fixed:
      Br: 0.20
    cases:
      - id: rs_25um
        sensor_average_radius: 25.0e-6
      - id: rs_50um
        sensor_average_radius: 50.0e-6
      - id: rs_75um
        sensor_average_radius: 75.0e-6
      - id: rs_100um
        sensor_average_radius: 100.0e-6
      - id: rs_500um
        sensor_average_radius: 500.0e-6

  Br_0p25T:
    fixed:
      Br: 0.25
    cases:
      - id: rs_25um
        sensor_average_radius: 25.0e-6
      - id: rs_50um
        sensor_average_radius: 50.0e-6
      - id: rs_75um
        sensor_average_radius: 75.0e-6
      - id: rs_100um
        sensor_average_radius: 100.0e-6
      - id: rs_500um
        sensor_average_radius: 500.0e-6

  Br_0p30T:
    fixed:
      Br: 0.30
    cases:
      - id: rs_25um
        sensor_average_radius: 25.0e-6
      - id: rs_50um
        sensor_average_radius: 50.0e-6
      - id: rs_75um
        sensor_average_radius: 75.0e-6
      - id: rs_100um
        sensor_average_radius: 100.0e-6
      - id: rs_500um
        sensor_average_radius: 500.0e-6
