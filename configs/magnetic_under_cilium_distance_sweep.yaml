# FEM distance sweep for the under-cilium Hall sensor geometry.
#
# Goal:
# - test whether the experimental signal scale can be explained by the
#   distance between the magnetic cilium and the active Hall area;
# - keep Br fixed, do not fit magnetization;
# - keep the sensor disk inside the FEM air box.

global:
  mode: magnetics-fem
  master_mode: under_cilium_distance_sweep
  results_write_mode: experiment
  experiment_id: under_cilium_distance_v1
  master_csv_path: ../results/magnetic_results_master.csv
  restart_dir: ../results/magnetic_cilium_3d_results_final/final_P2_hcil_20um_hsub_100um_delta_0p550mm
  output_dir: ../results/magnetic_fem_under_cilium_distance_results
  validation_summary_csv: magnetic_under_cilium_distance_summary.csv
  magnetic_boundary: natural
  sensor_average: true
  sensor_average_radius: 50.0e-6
  sensor_average_n: 13
  target_sensitivity_uT_per_uN: 0.63
  h_air: 75.0e-6
  h_air_near: 75.0e-6
  h_air_far: 225.0e-6
  near_radius_factor: 3.0
  near_source_padding_factor: 2.0
  near_sensor_padding_factor: 1.0
  air_radius_factor: 12.0
  # R = 60 um, so 20R = 1.2 mm keeps the deepest z_s = -1 mm case inside.
  air_below_factor: 20.0
  air_above_factor: 4.0
  projection_mode: cell_center
  max_air_cells: 700000

fixed_physical_parameters:
  Br: 0.20
  sensor_x: 0.0
  sensor_y: 0.0
  rotate_magnetization: true

sweep:
  distance:
    cases:
      - id: z_m0p10mm
        sensor_z: -0.10e-3
      - id: z_m0p15mm
        sensor_z: -0.15e-3
      - id: z_m0p20mm
        sensor_z: -0.20e-3
      - id: z_m0p30mm
        sensor_z: -0.30e-3
      - id: z_m0p50mm
        sensor_z: -0.50e-3
      - id: z_m0p75mm
        sensor_z: -0.75e-3
      - id: z_m1p00mm
        sensor_z: -1.00e-3
